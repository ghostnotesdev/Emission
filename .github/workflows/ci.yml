name: CI

on:
  push:
    branches: [master]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Pack
        run: dotnet pack ./Emission/Emission.csproj --no-build -c Release -o ./artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: emission-nuget-${{ github.sha }}
          path: ./artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 90

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: emission-binaries-${{ github.sha }}
          path: |
            ./Emission/bin/Release/netstandard2.0/Emission.dll
            ./Emission/bin/Release/netstandard2.0/Emission.pdb
            ./Emission/bin/Release/netstandard2.0/Emission.xml
          if-no-files-found: error
          retention-days: 90
