name: SonarQube

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: windows-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarScanner
        shell: pwsh
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin analysis
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin `
            /k:"ghostnotesdev_Emission" `
            /o:"ghostnotesdev" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test with coverage
        run: >
          dotnet test
          --no-build
          --no-restore
          -c Release
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Verify coverage generated
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Recurse -Filter coverage.opencover.xml)

          if ($reports.Count -eq 0) {
            throw "No coverage reports were generated."
          }

          Write-Host "Generated $($reports.Count) coverage report(s)."

      - name: End analysis
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end `
            /d:sonar.token="$env:SONAR_TOKEN"
