name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test with coverage
        run: >
          dotnet test
          --no-build
          -c Release
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Verify coverage generated
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Recurse -Filter coverage.opencover.xml)

          if ($reports.Count -eq 0) {
            throw "No coverage reports were generated."
          }

          Write-Host "Generated $($reports.Count) coverage report(s)."

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: emission-coverage
          path: '**/TestResults/**/coverage.opencover.xml'
          if-no-files-found: error

  sonar:
    name: SonarQube Analysis
    needs: build
    uses: ./.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
